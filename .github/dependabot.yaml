version: 2

# One Dependabot pull request per week for the whole repo (owner ruling
# 2026-09-14): every ecosystem below joins the `weekly` group, whose schedule is
# this repo's slot on a weeknight JST (hub `just dependabot-slot <repo>`) — one CI
# run on the runner pool per repo per week instead of one per ecosystem, and no
# org-wide Monday burst. The per-ecosystem cooldown and labels are unchanged;
# commit-message and open-pull-requests-limit live on the group (Dependabot
# refuses them on the entries).
multi-ecosystem-groups:
  weekly:
    schedule:
      interval: "weekly"
      day: "friday"
      time: "14:33"
      timezone: "Etc/UTC"

updates:

  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    patterns: ["*"]
    multi-ecosystem-group: "weekly"
    directory: "/"
  # Maintain dependencies for npm
  - package-ecosystem: "npm"
    patterns: ["*"]
    multi-ecosystem-group: "weekly"
    directory: "/app/frontend"
    # Ignore Vite 7.x for now: Vite >=7 requires Node >=20.19.0 while project engines.node is currently >=20.0.0
    ignore:
      - dependency-name: "vite"
        versions:
          - ">=7.0.0"

  # Maintain dependencies for pip
  - package-ecosystem: "pip"
    patterns: ["*"]
    multi-ecosystem-group: "weekly"
    directory: "/"
    ignore:
      - dependency-name: "pydantic-core"
